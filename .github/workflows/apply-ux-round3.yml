name: Apply UX round 3

on:
  push:
    branches:
      - agent/tdocs-word-docs-foundation
    paths:
      - scripts/apply-ux-round3.py
      - scripts/repair-ux-round3.py
      - .github/workflows/apply-ux-round3.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tdocs-word-docs-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Preserve generated source escapes
        run: python3 scripts/repair-ux-round3.py
      - name: Apply UX round 3
        run: python3 scripts/apply-ux-round3.py
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build renderer
        run: npm run build
      - name: Commit verified changes
        run: |
          git config user.name "TDocs Refactor Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src tests
          git commit -m "fix: separate Word workspace and stabilize code tools"
          git push origin HEAD:agent/tdocs-word-docs-foundation
