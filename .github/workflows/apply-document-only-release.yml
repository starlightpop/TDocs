name: Apply document-only 0.2.0 refactor
on:
  push:
    branches: [release/0.2.0-preview]
    paths:
      - scripts/apply-document-only-release.py
      - scripts/repair-document-source.py
      - scripts/repair-document-tests.py
      - .github/workflows/apply-document-only-release.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.2.0-preview
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply document-only refactor
        run: |
          python3 scripts/apply-document-only-release.py
          python3 scripts/repair-document-source.py
          python3 scripts/repair-document-tests.py
      - name: Verify Word runtime is removed
        run: |
          ! grep -RInE "const Page =|PageBreak|runReflow|splitCodeBlockAcrossPages|kind === 'word'|无标题 Word|A4 / B5|Word 排版|lineStart|continued|codeId|pm-page-wrap|manual-page-break|add-word-page" src
          test ! -f src/lib/viewModes.js
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build renderer
        run: npm run build
      - name: Commit verified refactor
        run: |
          git config user.name "TDocs Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "release: prepare document-only 0.2.0-preview"
          git push origin HEAD:release/0.2.0-preview
