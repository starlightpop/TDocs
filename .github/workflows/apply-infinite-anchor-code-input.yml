name: Apply infinite anchor and code input repair

on:
  push:
    branches: [release/0.2.0-preview]
    paths:
      - scripts/fix-infinite-anchor-code-input.py
      - .github/workflows/apply-infinite-anchor-code-input.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply focused repair
        run: python3 scripts/fix-infinite-anchor-code-input.py
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build renderer
        run: npm run build
      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/Editor.jsx \
            src/lib/headings.js \
            src/app.css \
            electron/code-runner.cjs \
            tests/infiniteDocumentCodeBlock.test.mjs \
            tests/codeRunner.test.mjs \
            RELEASE_NOTES.md
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "fix: keep document bottom hidden and restore code input"
            git push
          fi
