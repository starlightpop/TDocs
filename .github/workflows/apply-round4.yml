name: Apply round 4 fixes

on:
  push:
    branches:
      - agent/tdocs-word-docs-foundation
    paths:
      - scripts/apply-round4.py
      - scripts/repair-round4.py
      - .github/workflows/apply-round4.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tdocs-word-docs-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Repair staged patch
        run: python3 scripts/repair-round4.py
      - name: Apply fixes
        run: python3 scripts/apply-round4.py
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build renderer
        run: npm run build
      - name: Commit verified changes
        run: |
          git config user.name "TDocs Refactor Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src electron tests package.json package-lock.json
          git commit -m "fix: stabilize Word pages, code editing and document creation"
          git push origin HEAD:agent/tdocs-word-docs-foundation
