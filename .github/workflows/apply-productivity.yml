name: Apply TDocs productivity features

on:
  workflow_dispatch:
  push:
    branches: [agent/tdocs-word-docs-foundation]
    paths:
      - scripts/apply-productivity.mjs
      - .github/workflows/apply-productivity.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tdocs-word-docs-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply find, replace and local history
        run: node scripts/apply-productivity.mjs
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit productivity features
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "TDocs Refactor Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src tests
          git commit -m "foundation apply: add find replace and version history"
          git push origin HEAD:agent/tdocs-word-docs-foundation
