name: Optimize TDocs bundle

on:
  workflow_dispatch:
  push:
    branches: [agent/tdocs-word-docs-foundation]
    paths:
      - scripts/apply-performance.mjs
      - .github/workflows/apply-performance.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tdocs-word-docs-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: node scripts/apply-performance.mjs
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit bundle optimization
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "TDocs Refactor Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/Editor.jsx
          git commit -m "foundation apply: reduce syntax highlighting bundle"
          git push origin HEAD:agent/tdocs-word-docs-foundation
