name: Apply page flow follow-up

on:
  push:
    branches:
      - agent/tdocs-word-docs-foundation
    paths:
      - scripts/apply-page-flow-followup.py
      - .github/workflows/apply-page-flow-followup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tdocs-word-docs-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python3 scripts/apply-page-flow-followup.py
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit verified follow-up
        run: |
          git config user.name "TDocs Refactor Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/Editor.jsx tests/codeRunner.test.mjs
          git commit -m "fix: complete Word-style forward page flow"
          git push origin HEAD:agent/tdocs-word-docs-foundation
