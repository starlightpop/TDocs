name: Apply Markdown auto-detection repair

on:
  push:
    branches: [release/0.2.0-preview]
    paths:
      - scripts/restore-markdown-auto-detection.py
      - .github/workflows/apply-markdown-auto-detection.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply Markdown repair
        run: python3 scripts/restore-markdown-auto-detection.py
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build renderer
        run: npm run build
      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/Editor.jsx \
            src/App.jsx \
            tests/markdownAutoDetection.test.mjs \
            RELEASE_NOTES.md
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "fix: restore Markdown paste and typing detection"
            git push
          fi
