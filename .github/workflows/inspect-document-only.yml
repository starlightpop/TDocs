name: Inspect document-only boundaries
on:
  push:
    branches: [release/0.2.0-preview]
    paths: [.github/workflows/inspect-document-only.yml]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print structural ranges
        run: |
          echo '=== App state and handlers ==='
          nl -ba src/App.jsx | sed -n '285,380p'
          echo '=== App operations ==='
          nl -ba src/App.jsx | sed -n '350,590p'
          echo '=== App effects and topbar ==='
          nl -ba src/App.jsx | sed -n '735,930p'
          echo '=== App editor area ==='
          nl -ba src/App.jsx | sed -n '920,1160p'
          echo '=== Editor initialization ==='
          nl -ba src/components/Editor.jsx | sed -n '450,790p'
          echo '=== Editor pagination ==='
          nl -ba src/components/Editor.jsx | sed -n '760,1220p'
          echo '=== Editor render ==='
          nl -ba src/components/Editor.jsx | sed -n '1230,1385p'
