name: Apply TDocs foundation refactor

on:
  push:
    branches: [agent/tdocs-word-docs-foundation]
    paths:
      - scripts/apply-foundation.mjs
      - .github/workflows/apply-foundation.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tdocs-word-docs-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply architecture and UI refactor
        run: node scripts/apply-foundation.mjs
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Build renderer
        run: npm run build
      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "TDocs Refactor Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src package.json tests
          git commit -m "foundation: apply document and page mode refactor"
          git push origin HEAD:agent/tdocs-word-docs-foundation
