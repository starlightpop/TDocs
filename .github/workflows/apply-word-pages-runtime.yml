name: Apply Word page and runtime fixes

on:
  push:
    branches:
      - agent/tdocs-word-docs-foundation
    paths:
      - scripts/apply-word-pages-runtime.mjs
      - .github/workflows/apply-word-pages-runtime.yml

permissions:
  contents: write

concurrency:
  group: tdocs-word-pages-runtime
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tdocs-word-docs-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Repair generated source template escaping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('scripts/apply-word-pages-runtime.mjs')
          text = path.read_text()
          text = text.replace("`run('${escaped}')`", "\"run('\" + escaped + \"')\"")
          text = text.replace("`当前版本没有配置 ${language} 的本地运行器。`", "'当前版本没有配置 ' + language + ' 的本地运行器。'")
          text = text.replace("`本机没有安装 ${language} 运行环境，或运行程序不在 PATH 中。`", "'本机没有安装 ' + language + ' 运行环境，或运行程序不在 PATH 中。'")

          # 施工脚本中的模板主要用于生成 App/Editor/CSS 源码，禁止在施工阶段提前求值。
          text = re.sub(r'(?<!\\)\$\{', r'\\${', text)

          # code-runner 本身是嵌套在模板字符串中的源码。其正则和字符串里的换行需要再转义一层。
          marker = "write('electron/code-runner.cjs', `"
          start = text.index(marker)
          end = text.index("\n`)\n\nlet css", start)
          runner = text[start:end]
          runner = runner.replace('\\r', '\\\\r').replace('\\n', '\\\\n')
          text = text[:start] + runner + text[end:]
          path.write_text(text)
          PY
      - name: Apply page geometry and runtime fixes
        run: node scripts/apply-word-pages-runtime.mjs
      - name: Check Electron syntax
        run: |
          node --check electron/main.cjs
          node --check electron/preload.cjs
          node --check electron/code-runner.cjs
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Build renderer
        run: npm run build
      - name: Commit verified changes
        run: |
          git config user.name "TDocs Refactor Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src electron tests
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "fix: restore Word page geometry and real code execution"
          git push origin HEAD:agent/tdocs-word-docs-foundation
