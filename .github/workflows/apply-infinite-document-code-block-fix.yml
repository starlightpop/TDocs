name: Apply infinite document and code block fix

on:
  push:
    branches: [release/0.2.0-preview]
    paths:
      - scripts/fix-infinite-document-code-block.py
      - .github/workflows/apply-infinite-document-code-block-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply focused repair
        run: python3 scripts/fix-infinite-document-code-block.py
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build renderer
        run: npm run build
      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Editor.jsx src/app.css RELEASE_NOTES.md tests/infiniteDocumentCodeBlock.test.mjs
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "fix: restore infinite document and code block editing"
            git push
          fi
